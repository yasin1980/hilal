name: Hilal Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: gradle assembleDebug

      - name: APK dosyasını hazırla
        run: |
          mkdir -p apk-output
          cp app/build/outputs/apk/debug/app-debug.apk apk-output/HILAL-ANDROID-TEST.apk

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: HILAL-ANDROID-APK
          path: apk-output/HILAL-ANDROID-TEST.apk
